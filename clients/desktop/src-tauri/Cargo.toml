[package]
name = "weave-desktop"
version = "0.1.5"
edition = "2021"
license-file = "../../../LICENSE"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rand = "0.8"
# Default features: the OS TLS stack and certificate store (corporate CAs) and, on macOS,
# the system proxy settings; Windows proxy settings are read from the registry anyway.
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# `deep-link`: on Windows/Linux a `weave://` link starts a second instance;
# this feature hands its arguments to the running one as an open-url event.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
