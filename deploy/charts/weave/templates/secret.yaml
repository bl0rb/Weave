{{/*
Nur wenn secrets.create gilt. Setzt der Betrieb stattdessen
secrets.existingSecret, entsteht hier NICHTS: dieses Chart legt das fremde
Secret nicht an, veraendert es nicht und liest es nicht -- es nennt es nur
beim Namen. Das ist die einzige Naht, die dieses Chart fuer die
Secret-Provisionierung anbietet. Ein Wrapper-Chart, das den External
Secrets Operator oder Vault benutzt, erzeugt sein Secret dort und setzt
secrets.existingSecret darauf; SecretStore- oder ExternalSecret-Objekte
gehoeren bewusst nicht hierher, weil ihre Form vom Standort abhaengt.

Die Schluessel heissen wie die VARIABLEN aus secrets.<dienst> in
values.generated.yaml, nicht wie die Eintraege in weave.yaml: derselbe Wert
kann unter zwei Namen gebraucht werden (EMBEDDING_API_KEY im Knowledge- und
Retrieval-Dienst, EMBEDDINGS_API_TOKEN im Embeddings-Dienst) und braucht
dann beide Eintraege.

Was hier hineingeht, steht im Klartext in der Helm-Release-Historie und ist
fuer jeden lesbar, der `helm get values` darf. Fuer den Produktivbetrieb ist
secrets.existingSecret der richtige Weg.
*/}}
{{- if .Values.secrets.create }}
{{- include "weave.requireSecrets" . }}
{{- $known := include "weave.allSecretNames" . | fromYamlArray }}
{{- $unknown := list }}
{{- range $key, $_ := .Values.secrets.values }}
{{- if not (has $key $known) }}
{{- $unknown = append $unknown $key }}
{{- end }}
{{- end }}
{{- if $unknown }}
{{- fail (printf "secrets.values nennt %s -- kein Dienst in values.generated.yaml fragt danach. Entweder ein Tippfehler, oder der Wert gehoert nach weave.yaml und dann in eine neu erzeugte values.generated.yaml. Bekannt sind: %s" (join ", " $unknown) (join ", " $known)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "weave.fullname" .) }}
  labels:
    {{- include "weave.labels" (dict "ctx" $) | nindent 4 }}
  {{- $ann := include "weave.annotations" (dict "ctx" $) }}
  {{- with $ann }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $key := (keys .Values.secrets.values | sortAlpha) }}
  {{ $key }}: {{ get $.Values.secrets.values $key | toString | b64enc | quote }}
  {{- end }}
{{- end }}
