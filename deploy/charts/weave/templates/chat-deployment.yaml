{{/*
Die Chat-Oberflaeche. Quelle ist services/chat, das Image heisst
ghcr.io/bl0rb/weave-tools-frontend, und weave.yaml fuehrt den Dienst als
"chat" -- alle drei Namen meinen dieselbe Next.js-Anwendung. In values.yaml
und hier gilt der Name aus weave.yaml.

Sie spricht ausschliesslich mit Weave-API und nie direkt mit
Weave-Retrieval oder Weave-Tools, deshalb gibt es hier genau eine
ueberschriebene Adresse.

ZWEI ADRESSEN, DIE NICHT DASSELBE SIND:
  WEAVE_API_BASE_URL        liest nur der Server (Next.js Route Handler) --
                            clusterintern, hier ueberschrieben.
  WEAVE_API_PUBLIC_BASE_URL dorthin schickt der BROWSER den Benutzer beim
                            SSO-Anmelden. Diese Adresse muss von aussen
                            erreichbar sein, kommt deshalb aus der
                            Konfiguration und wird hier NICHT angefasst.
Dasselbe gilt fuer APP_BASE_URL: die oeffentliche Herkunft dieser
Oberflaeche selbst, die als return_to mitgeht.
*/}}
{{- if .Values.chat.enabled }}
{{- include "weave.validate" . }}
{{- $c := .Values.chat }}
{{- $auto := .Values.autoscaling.chat }}
{{- $name := include "weave.componentName" (dict "ctx" $ "component" "chat") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "weave.labels" (dict "ctx" $ "component" "chat") | nindent 4 }}
  {{- $ann := include "weave.annotations" (dict "ctx" $) }}
  {{- with $ann }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  # Bei eingeschalteter HPA nur der Startwert; danach gehoert die
  # Replikenzahl der HPA.
  replicas: {{ ternary $auto.minReplicas $c.replicas $auto.enabled }}
  selector:
    matchLabels:
      {{- include "weave.selectorLabels" (dict "ctx" $ "component" "chat") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weave.podLabels" (dict "ctx" $ "component" "chat" "extra" $c.podLabels) | nindent 8 }}
      {{- $pann := include "weave.podAnnotations" (dict "ctx" $ "extra" $c.podAnnotations) }}
      {{- with $pann }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "weave.serviceAccountName" . }}
      {{- with (include "weave.imagePullSecrets" .) }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with $c.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chat
          image: {{ include "weave.image" (dict "ctx" $ "image" $c.image) | quote }}
          imagePullPolicy: {{ include "weave.imagePullPolicy" (dict "ctx" $ "image" $c.image) }}
          {{- with $c.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Kein weave.secretEnv: secrets.chat ist in
            # values.generated.yaml leer -- diese Oberflaeche haelt kein
            # einziges Geheimnis. Sie hat keine eigene Identitaet und keinen
            # eigenen Zugang zu irgendeinem Dienst; angemeldet wird der
            # Benutzer bei Weave-API, und dessen Sitzung traegt der Browser.
            #
            # except: WEAVE_CHAT_PUBLIC_URL steht in weave.yaml beim Dienst
            # chat, gelesen wird sie aber vom Ingest-Frontend, nicht hier.
            #
            # rename: der .env-Schluessel heisst CHAT_APP_BASE_URL, damit er
            # neben den anderen *_BASE_URLs eindeutig bleibt; der Container
            # liest ihn als APP_BASE_URL.
            {{- include "weave.env" (dict "ctx" $ "service" "chat"
                  "except" (list "WEAVE_CHAT_PUBLIC_URL")
                  "rename" (dict "CHAT_APP_BASE_URL" "APP_BASE_URL")
                  "overrides" (dict
                    "WEAVE_API_BASE_URL" (include "weave.internalUrl" (dict "ctx" $ "component" "api"))
                  )) | nindent 12 }}
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $c.probes.liveness.enabled }}
          # Das Next.js-Image bringt keinen eigenen Health-Endpunkt mit
          # (services/chat hat keine /health-Route), also ist die Startseite
          # die Probe -- so wie beim Ingest-Frontend.
          livenessProbe:
            httpGet:
              path: {{ $c.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ $c.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $c.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $c.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $c.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if $c.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ $c.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ $c.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $c.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $c.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $c.probes.readiness.failureThreshold }}
          {{- end }}
{{- end }}
