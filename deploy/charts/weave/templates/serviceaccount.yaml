{{/*
Der ServiceAccount, den JEDER Pod dieses Charts benutzt -- jedes Deployment
und der db-bootstrap-Job setzen serviceAccountName auf
weave.serviceAccountName. Ohne dieses Objekt verweist jeder Pod auf einen
ServiceAccount, den es nicht gibt: das Manifest ist gueltig und `helm
template` bleibt still, aber im Cluster bleibt jeder Pod haengen
("error looking up service account <namespace>/weave"). Das faellt erst nach
dem Rollout auf.

Er bekommt bewusst KEINE Rolle und kein RoleBinding: kein Dienst dieser
Plattform spricht mit der Kubernetes-API. Er existiert, damit die Pods eine
eigene Identitaet haben statt der default-ServiceAccount des Namespace --
und damit ein Wrapper-Chart ueber serviceAccount.annotations eine
Cloud-Identitaet anhaengen kann (IRSA, Workload Identity), etwa fuer
postgresql.cnpg.backup.inheritFromIAMRole.

serviceAccount.create=false heisst: hier entsteht nichts, und
serviceAccount.name benennt einen, den jemand anders anlegt (leer =
"default").
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "weave.serviceAccountName" . }}
  labels:
    {{- include "weave.labels" (dict "ctx" $) | nindent 4 }}
  {{- $ann := include "weave.annotations" (dict "ctx" $ "extra" .Values.serviceAccount.annotations) }}
  {{- with $ann }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
