{{/*
===========================================================================
Die fuenf Dienste, die ueberhaupt nach aussen duerfen.

Alles andere spricht nur clusterintern miteinander und gehoert nicht ins
Internet -- insbesondere nicht retrieval, runtime und toolsBackend, die
nur ein statisches Bearer-Token trennt. Deshalb gibt es hier genau fuenf
Eintraege und kein Muster, mit dem sich ein sechster aus values.yaml
nachschieben liesse.

Der MCP-Server (toolsMcp) darf nur nach aussen, wenn er jede Anfrage selbst
per OAuth prueft (services/tools/app/mcp_auth.py): MCP_OAUTH_ISSUER und
MCP_OAUTH_RESOURCE_URL muessen in config.tools gesetzt sein, sonst steht
der Dienst ohne Anmeldung im Netz. Ausserdem muss MCP_ALLOWED_HOSTS den
oeffentlichen Hostnamen enthalten -- die Vorgabe kennt nur den
clusterinternen Service-Namen, und auf einen fremden Host-Header antwortet
der Dienst mit 421. Clients (VS Code, Claude Code) brauchen ausser /mcp
auch /.well-known/oauth-protected-resource und
/.well-known/oauth-protected-resource/mcp, daher die Vorgabe path "/"
(siehe docs/integrations/vscode-mcp-sso.md).

WARUM EINE DATEI STATT FUENF

Die fuenf Ingresses unterscheiden sich nur in drei Angaben (Schluessel in
.Values.ingress, Komponentenname des Services, Port). Als fuenf fast
gleiche Dateien waere die Pruefung requireIngressHosts fuenf Mal zu
vergessen; als eine Tabelle gilt sie fuer alle fuenf. toolsMcp liegt in
values.yaml unter toolsBackend.mcp, nicht auf oberster Ebene -- daher die
Eintraege "values" und "enabled" in der Liste (dasselbe Muster wie hpa.yaml).

WARUM KEIN VORGABE-HOSTNAME

Ein Hostname ist standortspezifisch. Ein mitgeliefertes Beispiel waere
entweder falsch oder wuerde versehentlich uebernommen, deshalb ist jeder
Ingress per Vorgabe aus und hosts leer -- und ein eingeschalteter Ingress
ohne hosts bricht mit einer lesbaren Meldung ab statt einen Catch-all zu
rendern, der jede Anfrage dieses Controllers abfaengt (weave.requireIngressHosts).

In der Praxis setzt ein Wrapper-Chart die Hostnamen; Annotationen fuer den
Controller (TLS-Aussteller, Body-Size, Rate-Limits) kommen aus
ingress.<name>.annotations und werden mit global.commonAnnotations
zusammengefuehrt.
===========================================================================
*/}}
{{- $ingresses := list
      (dict "key" "ingestFrontend" "component" "ingest-frontend" "workload" "ingestFrontend")
      (dict "key" "ingestBackend"  "component" "ingest-backend"  "workload" "ingestBackend")
      (dict "key" "chat"           "component" "chat"            "workload" "chat")
      (dict "key" "api"            "component" "api"             "workload" "api")
      (dict "key" "toolsMcp"       "component" "tools-mcp"       "workload" "toolsBackend.mcp"
            "values" .Values.toolsBackend.mcp
            "enabled" (and .Values.toolsBackend.enabled .Values.toolsBackend.mcp.enabled)) }}
{{- range $i := $ingresses }}
{{- $ing := get $.Values.ingress $i.key }}
{{/* Die Pruefung laeuft VOR dem enabled-Zweig, damit ein eingeschalteter
     Ingress ohne hosts auch dann auffaellt, wenn er sonst nichts rendern
     wuerde. */}}
{{- include "weave.requireIngressHosts" (dict "ctx" $ "name" $i.key) }}
{{- if $ing.enabled }}
{{- include "weave.validate" $ }}
{{- $workload := $i.values | default (get $.Values $i.workload) }}
{{- $workloadEnabled := ternary $i.enabled $workload.enabled (hasKey $i "enabled") }}
{{/* Ein Ingress auf einen abgeschalteten Dienst zeigt auf einen Service,
     den dieses Release nicht anlegt. Der Ingress-Controller meldet das als
     503 ohne Hinweis auf die Ursache -- also lieber hier abbrechen. */}}
{{- if not $workloadEnabled }}
{{- fail (printf "ingress.%s.enabled=true, aber %s.enabled=false. Der Ingress zeigte auf einen Service, den dieses Release nicht anlegt." $i.key $i.workload) }}
{{- end }}
{{- $svcName := include "weave.componentName" (dict "ctx" $ "component" $i.component) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "weave.labels" (dict "ctx" $ "component" $i.component) | nindent 4 }}
  {{- $ann := include "weave.annotations" (dict "ctx" $ "extra" $ing.annotations) }}
  {{- with $ann }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    {{- range $h := $ing.hosts }}
    - host: {{ required (printf "ingress.%s.hosts: jeder Eintrag braucht ein 'host'." $i.key) $h.host | quote }}
      http:
        paths:
          {{- range $p := (default (list (dict "path" "/" "pathType" "Prefix")) $h.paths) }}
          - path: {{ default "/" $p.path | quote }}
            pathType: {{ default "Prefix" $p.pathType }}
            backend:
              service:
                name: {{ $svcName }}
                port:
                  number: {{ $workload.service.port }}
          {{- end }}
    {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
