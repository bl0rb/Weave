{{/*
Weave-Ingest, Celery-Worker -- zwei Pools aus demselben Image (ADR-0001):

  ingest-worker     nur die OCR-Queue weave.ingest.ocr (process_job). Ein
                    Auftrag belegt einen Platz minutenlang; GPU, Modell-
                    Cache und das Skalieren nach Arbeit (KEDA) gehoeren hier hin.
  ingest-worker-io  die Queue weave.ingest.default: Confluence-Import,
                    Webhooks, Freigaben, die Tick-Ketten. Kurze Auftraege,
                    die nie hinter einer OCR warten sollen.

Kein Service: diese Workloads lauschen auf keinem Port, sie holen ihre
Auftraege aus Redis (logische Datenbank 0, ADR-0001).

Das command kommt aus dem Image (worker.Dockerfile, CMD celery -A
app.workers.tasks worker ...) und wird hier deshalb nicht wiederholt; die
Stellschrauben darin -- CELERY_QUEUES, CELERY_WORKER_CONCURRENCY,
CELERY_PREFETCH_MULTIPLIER, CELERY_MAX_TASKS_PER_CHILD -- kommen als
Umgebungsvariablen.

Kein gemeinsames Volume mit dem Backend: der Worker liest das Original aus
PostgreSQL in ein eigenes Verzeichnis unter /scratch und loescht es nach dem
Auftrag (app/workers/tasks.py).
*/}}
{{- $pools := list
      (dict "key" "ingestWorker"   "component" "ingest-worker"    "queues" "weave.ingest.ocr"     "ocr" true)
      (dict "key" "ingestWorkerIo" "component" "ingest-worker-io" "queues" "weave.ingest.default" "ocr" false) }}
{{- range $pool := $pools }}
{{- $w := get $.Values $pool.key }}
{{- if $w.enabled }}
{{- include "weave.validate" $ }}
{{- $hpa := get $.Values.autoscaling $pool.key }}
{{- $component := $pool.component }}
{{- $image := $w.image }}
{{- if not $image.repository }}
{{- $image = $.Values.ingestWorker.image }}
{{- end }}
{{- $cache := dict "enabled" false }}
{{- if $pool.ocr }}
{{- $cache = $w.modelCache }}
{{- end }}
{{- $cacheClaim := "" }}
{{- if $cache.enabled }}
{{- $cacheClaim = $cache.persistence.existingClaim | default (include "weave.componentName" (dict "ctx" $ "component" "ingest-worker-model-cache")) }}
{{- end }}
{{- $ov := dict
      "POSTGRES_HOST" (include "weave.postgresHost" $)
      "POSTGRES_PORT" (include "weave.postgresPort" $)
      "REDIS_URL" (include "weave.redisUrl" (dict "ctx" $ "db" 0))
      "PORTAL_KNOWLEDGE_BASE_URL" (include "weave.internalUrl" (dict "ctx" $ "component" "knowledge"))
      "CELERY_QUEUES" $pool.queues
      "DB_POOL_SIZE" (toString $w.dbPool.size)
      "DB_MAX_OVERFLOW" (toString $w.dbPool.maxOverflow)
      "TMPDIR" "/scratch"
      "WORKER_TMP_DIR" "/scratch/tasks" }}
{{- if not $pool.ocr }}
{{- $_ := set $ov "INGEST_WORKER_CONCURRENCY" (toString $w.concurrency) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weave.componentName" (dict "ctx" $ "component" $component) }}
  labels:
    {{- include "weave.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
  {{- $ann := include "weave.annotations" (dict "ctx" $) }}
  {{- with $ann }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if $hpa.enabled }}
  # replicas bleibt weg, solange HPA oder KEDA skalieren -- Begruendung
  # siehe ingest-backend-deployment.yaml.
  {{- else }}
  replicas: {{ $w.replicas }}
  {{- end }}
  {{- if and $cache.enabled $cache.persistence.enabled (not (has "ReadWriteMany" $cache.persistence.accessModes)) }}
  strategy:
    # Der Modell-Cache haengt an einem Volume, das nur EIN Knoten gleichzeitig
    # anhaengen kann. Ein RollingUpdate startet den neuen Pod, bevor der alte
    # endet; landet er auf einem anderen Knoten, bekommt er das Volume nie und
    # bleibt fuer immer Pending, waehrend der alte Pod nicht beendet wird --
    # das Upgrade kommt dann nie durch. Recreate beendet erst, startet dann.
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "weave.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weave.podLabels" (dict "ctx" $ "component" $component "extra" $w.podLabels) | nindent 8 }}
      {{- $pann := include "weave.podAnnotations" (dict "ctx" $ "extra" $w.podAnnotations) }}
      {{- with $pann }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "weave.serviceAccountName" $ }}
      # Celery beendet bei SIGTERM erst die laufenden Auftraege. Was nach
      # dieser Frist noch laeuft, stellt der Reaper neu ein (Heartbeat in
      # der Datenbank, app/workers/tasks.py).
      terminationGracePeriodSeconds: {{ $w.terminationGracePeriodSeconds }}
      {{- if $pool.ocr }}
      {{- with $w.runtimeClassName }}
      # Nur noetig, wo der NVIDIA-Runtime als eigene RuntimeClass exponiert ist
      # (siehe values.yaml) -- die OCR-Pfade dieses Workers nutzen die GPU,
      # wenn eine da ist.
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- end }}
      {{- with (include "weave.imagePullSecrets" $) }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with $w.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "weave.image" (dict "ctx" $ "image" $image) | quote }}
          imagePullPolicy: {{ include "weave.imagePullPolicy" (dict "ctx" $ "image" $image) }}
          {{- with $w.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # Erst die Geheimnisse, dann die Konfiguration -- REDIS_URL traegt
            # $(REDIS_PASSWORD), siehe den Kopf von _helpers.tpl.
            #
            # Der Worker bekommt dieselbe Umgebung wie das Backend, absichtlich:
            # er importiert dasselbe app/core/config.py, das beim Import
            # abbricht, wenn SECRET_KEY fuer eine Nicht-SQLite-Datenbank fehlt.
            # Ein Zuviel schadet hier nicht, ein Zuwenig laesst den Prozess gar
            # nicht erst starten.
            {{- include "weave.secretEnv" (dict "ctx" $ "service" "ingest") | nindent 12 }}
            {{- /* weave.yaml names this INGEST_WORKER_CONCURRENCY (so it
                 cannot collide with weave-knowledge-worker's own
                 CELERY_WORKER_CONCURRENCY in docker-compose.weave.yml's
                 shared variable pool), but worker.Dockerfile's CMD still
                 reads the container env var literally named
                 CELERY_WORKER_CONCURRENCY -- renamed back here, same
                 pattern as the secretEnv rename table above. The IO pool
                 overrides the value with ingestWorkerIo.concurrency. */}}
            {{- include "weave.env" (dict "ctx" $ "service" "ingest" "rename" (dict
                  "INGEST_WORKER_CONCURRENCY" "CELERY_WORKER_CONCURRENCY"
                ) "overrides" $ov) | nindent 12 }}
            {{- if $cache.enabled }}
            # Derselbe Wert, den worker.Dockerfile schon als ENV HOME setzt,
            # hier wiederholt, damit Mountpunkt und HOME in EINER Datei
            # nebeneinander stehen: PaddleOCR laedt seine Gewichte zur Laufzeit
            # nach $HOME/.paddlex bzw. $HOME/.paddleocr. Zeigte HOME woandershin
            # als der Mount unten, liefe der Download in die schreibbare Schicht
            # des Containers und jeder Neustart holte mehrere hundert MB neu.
            - name: HOME
              value: /home/weave-ingest
            {{- end }}
          {{- with $w.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* Keine Proben: ein Celery-Worker hat keinen HTTP-Port, gegen den
                 eine httpGet-Probe laufen koennte. ingestWorker.probes steht in
                 values.yaml aus genau diesem Grund auf enabled: false. */}}
          volumeMounts:
            - name: scratch
              mountPath: /scratch
            {{- if $cache.enabled }}
            - name: model-cache
              mountPath: /home/weave-ingest
            {{- end }}
      volumes:
        # Fluechtig und je Pod: ein Verzeichnis je laufendem Auftrag
        # (WORKER_TMP_DIR) plus die Zwischendateien der Konvertierung (TMPDIR).
        - name: scratch
          emptyDir:
            {{- if $w.scratch.sizeLimit }}
            sizeLimit: {{ $w.scratch.sizeLimit | quote }}
            {{- else }}
            {}
            {{- end }}
        {{- if $cache.enabled }}
        - name: model-cache
          {{- if $cache.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $cacheClaim | quote }}
          {{- else }}
          emptyDir:
            {{- if $cache.sizeLimit }}
            sizeLimit: {{ $cache.sizeLimit | quote }}
            {{- else }}
            {}
            {{- end }}
          {{- end }}
        {{- end }}
{{- end }}
{{- end }}
