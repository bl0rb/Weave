{{/*
Weave-Ingest, Backend -- nimmt Uploads entgegen, legt Jobs an, bedient die
Verwaltungsoberflaeche und ist zugleich der Identitaetsanbieter, von dem
Weave-API seine Benutzer borgt (ADR-0004).

Der zugehoerige Service steht in ingest-backend-service.yaml. Ein gemeinsames
Ablage-Volume mit dem Worker gibt es nicht: Originale, Ergebnisse und Bilder
liegen in PostgreSQL (app/services/object_store.py); der Pod hat nur sein
eigenes fluechtiges /scratch.
*/}}
{{- if .Values.ingestBackend.enabled }}
{{- include "weave.validate" . }}
{{- $w := .Values.ingestBackend }}
{{- $hpa := .Values.autoscaling.ingestBackend }}
{{- $component := "ingest-backend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weave.componentName" (dict "ctx" $ "component" $component) }}
  labels:
    {{- include "weave.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
  {{- $ann := include "weave.annotations" (dict "ctx" $) }}
  {{- with $ann }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if $hpa.enabled }}
  # Mit eingeschalteter HPA wird replicas hier bewusst WEGGELASSEN statt auf
  # minReplicas gesetzt: sonst traegt jedes `helm upgrade` -- und in einer
  # GitOps-Installation jeder ArgoCD-Sync -- die Replikenzahl wieder auf den
  # Wert aus dem Manifest zurueck und macht damit jede Hochskalierung der HPA
  # rueckgaengig. Ein fehlendes replicas laesst Kubernetes das Feld beim
  # ersten Anlegen mit 1 vorbelegen und danach allein die HPA schreiben.
  {{- else }}
  replicas: {{ $w.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "weave.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weave.podLabels" (dict "ctx" $ "component" $component "extra" $w.podLabels) | nindent 8 }}
      {{- $pann := include "weave.podAnnotations" (dict "ctx" $ "extra" $w.podAnnotations) }}
      {{- with $pann }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "weave.serviceAccountName" . }}
      {{- with (include "weave.imagePullSecrets" .) }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with $w.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingest-backend
          image: {{ include "weave.image" (dict "ctx" $ "image" $w.image) | quote }}
          imagePullPolicy: {{ include "weave.imagePullPolicy" (dict "ctx" $ "image" $w.image) }}
          {{- with $w.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            # Fest 8000: entrypoint.sh startet uvicorn mit --port 8000, das ist
            # keine Einstellung. Welchen Port der Service nach aussen anbietet,
            # entscheidet ingestBackend.service.port; er zielt auf diesen
            # benannten Port, nicht auf eine Zahl.
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # REIHENFOLGE: erst die Geheimnisse, dann die Konfiguration. Der
            # unten erzeugte REDIS_URL traegt $(REDIS_PASSWORD), und Kubernetes
            # loest ein $(VAR) nur aus einem Eintrag auf, der WEITER OBEN in
            # derselben env-Liste steht. Siehe den Kopf von _helpers.tpl.
            {{- include "weave.secretEnv" (dict "ctx" $ "service" "ingest") | nindent 12 }}
            {{- $ov := dict
                  "POSTGRES_HOST" (include "weave.postgresHost" $)
                  "POSTGRES_PORT" (include "weave.postgresPort" $)
                  "REDIS_URL" (include "weave.redisUrl" (dict "ctx" $ "db" 0))
                  "PORTAL_KNOWLEDGE_BASE_URL" (include "weave.internalUrl" (dict "ctx" $ "component" "knowledge"))
                  "SYSTEM_STATUS_TARGETS" (include "weave.systemStatusTargets" $)
                  "DB_POOL_SIZE" (toString $w.dbPool.size)
                  "DB_MAX_OVERFLOW" (toString $w.dbPool.maxOverflow)
                  "TMPDIR" "/scratch"
                  "BACKUP_DIR" "/scratch/backups" }}
            {{- /*
            Dieselbe Adressierung wie fuer knowledge/retrieval: nur wenn
            dieses Release den jeweiligen Modelldienst mitbringt UND die
            Konfiguration die Adresse leer laesst -- sonst gewinnt weave.yaml.
            Ohne diesen Block muesste EMBEDDING_BASE_URL/RERANK_BASE_URL fuer
            ingest von Hand gesetzt werden, obwohl knowledge/retrieval sie
            geschenkt bekommen. Siehe weave.embeddingBaseUrl/weave.rerankBaseUrl.
            */}}
            {{- with (include "weave.embeddingBaseUrl" (dict "ctx" $ "service" "ingest")) }}
            {{- $_ := set $ov "EMBEDDING_BASE_URL" . }}
            {{- end }}
            {{- with (include "weave.rerankBaseUrl" (dict "ctx" $)) }}
            {{- $_ := set $ov "RERANK_BASE_URL" . }}
            {{- end }}
            {{- include "weave.env" (dict "ctx" $ "service" "ingest" "overrides" $ov) | nindent 12 }}
            # Kein Wert aus weave.yaml, sondern eine Entscheidung dieser
            # Installation: entrypoint.sh faehrt Alembic beim Start, sofern
            # RUN_ALEMBIC_ON_STARTUP nicht "false" ist. Mehrere Repliken
            # serialisieren sich ueber die Advisory-Sperre in alembic/env.py.
            - name: RUN_ALEMBIC_ON_STARTUP
              value: {{ $w.runAlembicOnStartup | quote }}
          {{- if $w.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ $w.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ $w.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $w.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $w.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $w.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if $w.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ $w.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ $w.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $w.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $w.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $w.probes.readiness.failureThreshold }}
          {{- end }}
          {{- with $w.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: scratch
              mountPath: /scratch
      volumes:
        # Fluechtig und je Pod: gepufferte Uploads (TMPDIR) und hochgeladene
        # Archive einer Wiederherstellung (BACKUP_DIR). Nichts davon muss einen
        # Neustart ueberleben -- die Daten selbst liegen in PostgreSQL.
        - name: scratch
          emptyDir:
            {{- if $w.scratch.sizeLimit }}
            sizeLimit: {{ $w.scratch.sizeLimit | quote }}
            {{- else }}
            {}
            {{- end }}
{{- end }}
