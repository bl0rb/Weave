# Generated by scripts/weave_config.py helm-values from weave.yaml.
# DO NOT EDIT BY HAND -- edit weave.yaml and re-generate:
#
#     python scripts/weave_config.py helm-values \
#         --out deploy/charts/weave/values.generated.yaml
#
# This is the SECOND consumer of weave.yaml, next to `render` (which writes
# deploy/.env for the compose stack). Both read the same declarations, so a
# setting exists in exactly one place: weave.yaml. Nothing below belongs in
# the chart's hand-maintained values.yaml.
#
# `config.<service>` carries every NON-secret setting, already serialized
# exactly as `render` would write it into the .env (json_list stays compact
# JSON, numbers and booleans stay strings) -- the chart quotes them straight
# into a container's env.
#
# `secrets.<service>` carries only the NAMES of that service's secret
# settings. No value, and no placeholder either: what a name resolves to is
# decided in the cluster, by the Secret named in secrets.existingSecret or
# built from secrets.values (see the chart's values.yaml).
#
# The values here are weave.yaml's own defaults. Unlike `render`, this
# command deliberately ignores environment variables that happen to match a
# rendered variable name: a generated chart values file must describe the
# platform, not the machine it was generated on.
#
# Pass this file alongside the chart's own values, e.g.
#
#     helm install weave deploy/charts/weave \
#         -f deploy/charts/weave/values.generated.yaml

