  runAlembicOnStartup: true
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  probes:
    liveness:
      enabled: true
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    readiness:
      enabled: true
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

# Gleiches Image wie knowledge, anderes command:
#   celery -A app.workers.tasks worker --loglevel=info -Q weave.knowledge.index
knowledgeWorker:
  enabled: true
  image:
    repository: ghcr.io/bl0rb/weave-knowledge
    tag: ""
    pullPolicy: ""
  replicas: 1
  # Die Queue, die dieser Worker abarbeitet (ADR-0001: je Dienst eine eigene
