# Die von Hand gepflegte Haelfte der Chart-Konfiguration.
#
# Was hier NICHT steht: jede Variable, die weave.yaml deklariert. Die kommt
# aus values.generated.yaml, das `python scripts/weave_config.py helm-values`
# aus derselben weave.yaml erzeugt, aus der `render` die deploy/.env baut.
# Eine Variable, die dort steht, wird hier nicht wiederholt -- sonst gaebe es
# zwei Quellen, die auseinanderlaufen koennen.
#
#     helm install weave deploy/charts/weave \
#         -f deploy/charts/weave/values.generated.yaml \
#         -f meine-werte.yaml
#
# Was hier steht, ist alles, was eine weave.yaml gar nicht kennen kann:
# Images, Repliken, Ressourcen, Scheduling, Storage, Ingress, und die Frage,
# woher Postgres und Redis kommen.
#
# UMWICKELBARKEIT: Ueber diesem Chart liegt in der Praxis ein privates
# Wrapper-Chart, das es als Dependency zieht und alles Standortspezifische
# ergaenzt -- Secret-Provisionierung (External Secrets Operator/Vault),
# Ingress-Hostnamen, StorageClasses, NetworkPolicies, ArgoCD-Sync-Waves.
# Dieses Chart erzwingt davon nichts: es rendert keine SecretStore-,
# ExternalSecret- oder NetworkPolicy-Objekte, kennt keinen Vorgabe-Hostnamen,
# hat Ingress per Vorgabe aus, und jedes Objekt nimmt zusaetzliche
# Annotationen aus global.commonAnnotations bzw. dem jeweiligen Workload
# entgegen, damit ein Wrapper z.B. Sync-Waves setzen kann, ohne dieses Chart
# zu aendern.

nameOverride: ""
fullnameOverride: ""

global:
  # Praefix fuer JEDES image.repository unten, z.B. "registry.corp.internal"
  # fuer eine gespiegelte Registry. Leer heisst: die Repositories werden
  # unveraendert benutzt (ghcr.io/bl0rb/...).
  imageRegistry: ""
  # Gilt fuer alle Workloads; ein Workload kann sie mit image.pullPolicy
  # ueberschreiben.
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Auf JEDES Objekt des Charts gelegt (Deployments, Services, PVCs, Jobs,
  # Ingresses, Secret, Postgres-Cluster).
  commonLabels: {}
  # Ebenso -- der Platz fuer argocd.argoproj.io/sync-wave und Aehnliches.
  commonAnnotations: {}
  # Auf jeden Pod jedes Workloads zusaetzlich zu dessen eigenen
  # podAnnotations/podLabels.
  podAnnotations: {}
  podLabels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# config / secrets -- die generierte Haelfte
# ---------------------------------------------------------------------------

# Wird von values.generated.yaml gefuellt: config.<dienst>.<VAR> = "wert",
# nur Nicht-Geheimnisse. Hier leer, damit ein `helm template` ohne die
# generierte Datei nicht an einem nil scheitert, sondern an der lesbaren
# Meldung aus weave.requireGeneratedValues.
config: {}

secrets:
  # RESERVIERTE SCHLUESSEL in diesem Block: existingSecret, create, values,
  # optional. JEDER ANDERE Schluessel ist ein Dienstname, dessen Wert die
  # Liste der Geheimnis-VARIABLENNAMEN dieses Dienstes ist -- geschrieben von
  # `weave_config.py helm-values`, nicht von Hand. Ein Dienst heisst in
  # weave.yaml nie wie einer der vier reservierten Schluessel.

  # ENTWEDER: Name eines Secrets, das jemand anders fuellt -- der External
  # Secrets Operator, Vault, ein Wrapper-Chart, ein `kubectl create secret`.
  # Das Secret muss zum Zeitpunkt des Pod-Starts existieren und je Eintrag
  # aus secrets.<dienst> einen Schluessel gleichen Namens tragen
  # (POSTGRES_PASSWORD, RETRIEVAL_API_TOKEN, ...). Das Chart legt es nicht
  # an und veraendert es nicht.
  existingSecret: ""

  # ODER: das Chart legt ein eigenes Secret "<fullname>-secrets" aus
  # secrets.values an. Genau eines von beidem -- beides oder keines von
  # beidem laesst weave.requireSecrets mit einer lesbaren Meldung
  # fehlschlagen.
  create: false
  # Schluessel sind die VARIABLENNAMEN aus secrets.<dienst>, nicht die
  # weave.yaml-Schluessel: derselbe Wert kann unter zwei Namen gebraucht
  # werden (EMBEDDING_API_KEY im Knowledge/Retrieval, EMBEDDINGS_API_TOKEN im
  # Embeddings-Dienst) und braucht dann beide Eintraege.
  # Fuer den Produktivbetrieb ist existingSecret der richtige Weg: was hier
  # steht, landet im Klartext in der Helm-Release-Historie.
  values: {}
  #   WEAVE_POSTGRES_PASSWORD wird NICHT hier eingetragen -- der Schluessel
  #   heisst wie die VARIABLE, also:
  #   POSTGRES_PASSWORD: ""
  #   RETRIEVAL_DB_PASSWORD: ""
  #   REDIS_PASSWORD: ""
  #   SECRET_KEY: ""
  #   ...

  # secretKeyRef mit optional: true. Grund: mit existingSecret weiss dieses
  # Chart nicht, welche Schluessel der externe Store tatsaechlich liefert.
  # Ein fehlender Pflichtschluessel wird dann nicht zu einem
  # CreateContainerConfigError ohne Hinweis auf die Ursache, sondern der
  # Dienst startet und seine EIGENE Startpruefung sagt, welche Einstellung
  # fehlt (jeder Weave-Dienst prueft seine Pflichtwerte beim Start). Auf
  # false setzen, wenn der Pod lieber gar nicht erst starten soll.
  optional: true

# Variablen aus values.generated.yaml, die in einem Cluster keine Bedeutung
# haben und deshalb in KEINEN Container gehen. Sie sind trotzdem in
# weave.yaml richtig aufgehoben -- sie steuern dort die Compose-Datei.
env:
  exclude:
    # Image-Tags: im Chart macht das image.tag/appVersion.
    - WEAVE_INGEST_TAG
    - WEAVE_KNOWLEDGE_TAG
    - WEAVE_RETRIEVAL_TAG
    - WEAVE_RUNTIME_TAG
    - WEAVE_API_TAG
    - WEAVE_TOOLS_TAG
    - WEAVE_TOOLS_FRONTEND_TAG
    - WEAVE_EMBEDDINGS_TAG
    - WEAVE_RERANKER_TAG
    # Host-Ports, auf denen Compose die Container veroeffentlicht. Im
    # Cluster macht das der Service bzw. der Ingress; der Container lauscht
    # immer auf 8000 (Backends) bzw. 3000 (Frontends).
    - BACKEND_PORT
    - FRONTEND_PORT
    - KNOWLEDGE_PORT
    - RETRIEVAL_PORT
    - RUNTIME_PORT
    - API_PORT
    - TOOLS_PORT
    - TOOLS_FRONTEND_PORT
    - EMBEDDINGS_PORT
    - RERANKER_PORT
    # Compose-eigene Container-Limits; im Chart macht das
    # ingestWorker.resources.
    - WORKER_CPUS
    - WORKER_MEMORY_LIMIT

# Cluster-interne Adressen, unter denen die Dienste einander erreichen.
# Diese Adressen stehen bewusst NICHT in weave.yaml: dort steht der
# Docker-Compose-Servicename (http://weave-knowledge:8000), den es in einem
# Cluster nicht gibt. Leer heisst: aus dem Release abgeleitet, also
# http://<fullname>-<komponente>:8000. Ein gesetzter Wert gewinnt gegenueber
# dem generierten config-Wert -- so erreicht man z.B. einen Dienst, der in
# einem anderen Namespace oder gar nicht aus diesem Release kommt.
internalUrls:
  ingestBackend: ""
  knowledge: ""
  retrieval: ""
  runtime: ""
  api: ""
  toolsBackend: ""
  embeddings: ""
  reranker: ""

# ---------------------------------------------------------------------------
# Workloads
#
# Elf Images, dreizehn moegliche Workloads: weave-knowledge laeuft zweimal
# (Dienst und Celery-Worker, gleiches Image, anderes command), und
# weave-tools-backend ebenfalls (REST-Dienst und, per Vorgabe aus, der
# MCP-Server unter toolsBackend.mcp).
# ---------------------------------------------------------------------------

ingestBackend:
  enabled: true
  image:
    repository: ghcr.io/bl0rb/weave-ingest-backend
    # Leer heisst: die appVersion des Charts. Ein Release setzt Chart- und
    # App-Version auf denselben Tag wie die Images.
    tag: ""
    # Leer heisst: global.imagePullPolicy.
    pullPolicy: ""
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  # Alembic laeuft beim Start des Backends (entrypoint.sh). Bei mehr als
  # einer Replik startet die Migration mehrfach parallel -- fuer ein Upgrade
  # entweder auf 1 Replik gehen oder hier abschalten und die Migration
  # separat fahren.
  runAlembicOnStartup: true
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  probes:
    liveness:
      enabled: true
      path: /api/v1/health
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    readiness:
      enabled: true
      path: /api/v1/health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

ingestWorker:
  enabled: true
  image:
    repository: ghcr.io/bl0rb/weave-ingest-worker
    tag: ""
    pullPolicy: ""
  replicas: 1
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # RuntimeClass fuer GPU-Knoten, auf denen der NVIDIA-Runtime als eigene
  # RuntimeClass exponiert ist (typisch mit dem NVIDIA GPU Operator). Leer
  # lassen, wo GPU-Knoten den NVIDIA-Runtime ohnehin als Default haben.
  runtimeClassName: ""
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # Ein Celery-Worker hat keinen HTTP-Port; eine HTTP-Probe gibt es hier
  # deshalb nicht.
  probes:
    liveness:
      enabled: false
    readiness:
      enabled: false
  # PaddleOCR laedt seine Gewichte zur Laufzeit nach $HOME (/home/weave-ingest,
  # uid 1000). Ohne Persistenz laedt jeder Pod-Neustart mehrere hundert MB
  # neu; in Clustern mit eingeschraenktem Egress schlaegt das fehl und die
  # Jobs fallen still auf den Klartext-Pfad ohne OCR zurueck.
  modelCache:
    enabled: true
    # Ohne Persistenz: emptyDir. Leer = kein sizeLimit.
    sizeLimit: ""
    persistence:
      enabled: false
      # Bei mehr als einer Replik muss hier ReadWriteMany stehen, sonst
      # starten Repliken auf anderen Knoten nie.
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      storageClassName: ""
      existingClaim: ""

ingestFrontend:
  enabled: true
  image:
    repository: ghcr.io/bl0rb/weave-ingest-frontend
    tag: ""
    pullPolicy: ""
  replicas: 1
  service:
    type: ClusterIP
    port: 3000
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # Das Next.js-Image bringt keinen /health-Endpunkt mit -- die Startseite
  # ist die Probe.
  probes:
    liveness:
      enabled: true
      path: /
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    readiness:
      enabled: true
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

knowledge:
  enabled: true
  image:
    repository: ghcr.io/bl0rb/weave-knowledge
    tag: ""
    pullPolicy: ""
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  # Dieser Dienst besitzt das Schema in weave_knowledge und faehrt als
