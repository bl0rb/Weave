  service:
    type: ClusterIP
    port: 8000
  # Dieser Dienst besitzt das Schema in weave_api und faehrt Alembic beim
  # Start (ADR-0004).
  runAlembicOnStartup: true
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
