  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  probes:
    liveness:
      enabled: true
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    readiness:
      enabled: true
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

runtime:
  enabled: true
  image:
    repository: ghcr.io/bl0rb/weave-runtime
    tag: ""
    pullPolicy: ""
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  probes:
    liveness:
      enabled: true
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    readiness:
      enabled: true
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  # Der Bot-Roster (BOTS_DIR, im Image ./bots) wird bei jedem Aufruf frisch
  # von der Platte gelesen. enabled: false laesst es beim Inhalt des Images
  # (die zwei mitgelieferten Beispiel-Bots); enabled: true macht ihn
  # beschreibbar und ueberlebt einen Neustart. Bei mehr als einer Replik
  # muessen die accessModes ReadWriteMany enthalten.
  botsPersistence:
    enabled: false
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClassName: ""
    existingClaim: ""

api:
  enabled: true
  image:
    repository: ghcr.io/bl0rb/weave-api
    tag: ""
    pullPolicy: ""
