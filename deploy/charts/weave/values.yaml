      failureThreshold: 6
    readiness:
      enabled: true
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  # Dasselbe Image bringt einen ZWEITEN ASGI-Dienst mit, den MCP-Server
  # (app/mcp_server.py, streamable-HTTP unter /mcp). Er laeuft absichtlich
  # als eigener uvicorn-Prozess, nicht im selben Container. Per Vorgabe aus:
  # ob er gebraucht wird, haengt daran, ob in dieser Installation ueberhaupt
  # ein MCP-Client existiert. Anders als die REST-Oberflaeche hat er kein
  # eigenes Diensttoken -- er authentifiziert jeden Aufruf allein ueber den
  # Authorization-Header, den der Aufrufer schon mitbringt.
  mcp:
    enabled: false
    replicas: 1
    service:
      type: ClusterIP
      port: 8000
    resources: {}
    podAnnotations: {}

chat:
