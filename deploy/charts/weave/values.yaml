toolsBackend:
  enabled: true
  image:
    repository: ghcr.io/bl0rb/weave-tools-backend
    tag: ""
    pullPolicy: ""
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
