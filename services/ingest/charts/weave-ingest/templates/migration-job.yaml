{{- if and .Values.backend.enabled .Values.migrationJob.enabled }}
{{- if not .Values.database.useExternal }}
{{- fail "database.useExternal must be true. This chart supports only external PostgreSQL." }}
{{- end }}
{{- include "weave-ingest.requireSecretKey" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "weave-ingest.fullname" . }}-migrate
  labels:
    {{- include "weave-ingest.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "weave-ingest.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "weave-ingest.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrationJob.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.migrationJob.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["sh", "-c", "alembic upgrade head"]
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.passwordSecret.name is required" .Values.database.passwordSecret.name }}
                  key: {{ required "database.passwordSecret.key is required" .Values.database.passwordSecret.key }}
            - name: DATABASE_URL
              value: postgresql+psycopg://{{ required "database.user is required" .Values.database.user }}:$(DATABASE_PASSWORD)@{{ required "database.host is required" .Values.database.host }}:{{ .Values.database.port }}/{{ required "database.database is required" .Values.database.database }}
            - name: DATABASE_SCHEMA
              value: {{ .Values.database.schema | quote }}
            {{- if include "weave-ingest.secretKeyEffective" . }}
            # alembic/env.py imports app/core/config.py, which fails fast at
            # import time if SECRET_KEY is unset for a non-sqlite database --
            # required here even though this job never signs anything itself.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "weave-ingest.secretKeySecretName" . }}
                  key: {{ include "weave-ingest.secretKeySecretKey" . }}
            {{- end }}
            {{- if include "weave-ingest.redisAuthEffective" . }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "weave-ingest.redisAuthSecretName" . }}
                  key: {{ include "weave-ingest.redisAuthSecretKey" . }}
            {{- end }}
            - name: REDIS_URL
              value: {{ include "weave-ingest.redisUrl" . | quote }}
{{- end }}
