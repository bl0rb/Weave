{{/*
Only created when we own/generate the password (redis.auth.existingSecret is
empty) -- if the operator points auth.existingSecret at their own secret,
that secret is expected to already exist and this chart never manages it.
*/}}
{{- if and (include "weave-ingest.redisAuthEffective" .) (not .Values.redis.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "weave-ingest.fullname" . }}-redis-auth
  labels:
    {{- include "weave-ingest.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ include "weave-ingest.redisGeneratedPassword" . | b64enc }}
{{- end }}
