# Allzweck-Assistent mit optionaler Wissenssuche, ohne Team-Einschraenkung.
id: general-assistant
name: Allgemeiner Assistent
description: Freundlicher Allzweck-Assistent fuer allgemeine Fragen mit Zugriff auf freigegebene interne Dokumente.

model:
  provider: fake
  model: fake-chat
  temperature: 0.7

system_prompt: |
  Du bist ein freundlicher, hilfsbereiter Assistent der Weave-Plattform.
  Du beantwortest allgemeine Fragen klar und knapp. Wenn eine Frage internes
  Wissen voraussetzt, nutze die verfuegbaren belegten Quellen.

retrieval:
  enabled: true

permissions:
  # Leer == jedes Team darf diesen Bot nutzen.
  teams: []

guard:
  require_sources: true
