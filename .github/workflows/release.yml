name: Release

# Pushing a tag `vX.Y.Z` publishes everything a deployment needs: the eleven
# container images the Compose stack and the Helm chart refer to, the chart
# itself, and a GitHub release.
#
# Nothing is published before the full test suite passes on the tagged commit.
# The gate calls pr-ci.yml with `run_all`, because that workflow normally runs
# only the services a change touched -- a rule that makes no sense for a tag,
# where there is no "changed since" to compare against.
#
# A pre-release tag (anything containing a hyphen, e.g. v0.2.0-rc.1) publishes
# its own version tag but deliberately does NOT move `latest`, and its GitHub
# release is marked as a prerelease.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.2.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: bl0rb
  CHART_PATH: services/ingest/charts/weave-ingest
  OCI_REPO: ghcr.io/bl0rb/charts

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Derive version and release kind
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Guard against a mistyped manual run reaching the registry: the
          # value below ends up in image tags and a chart version, and Helm
          # rejects anything that is not semver anyway -- better to fail here
          # with a readable message than halfway through publishing.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${VERSION}' is not a semver version (expected 1.2.3 or 1.2.3-rc.1)"
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  ci:
    name: Test everything
    needs: version
    uses: ./.github/workflows/pr-ci.yml
    with:
      run_all: true
    permissions:
      contents: read
      pull-requests: read

  images:
    name: ${{ matrix.image }}
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Contexts and Dockerfiles are the ones deploy/docker-compose.local.yml
          # builds from -- that override is what proves they work.
          - image: weave-ingest-backend
            context: services/ingest/backend
            dockerfile: services/ingest/backend/Dockerfile
            platforms: linux/amd64,linux/arm64
          # amd64 only. The worker installs paddlepaddle, and building that
          # tree for arm64 under QEMU takes hours for an image whose GPU
          # variant is amd64-only to begin with (see worker.Dockerfile's own
          # TARGETARCH branch).
          - image: weave-ingest-worker
            context: services/ingest/backend
            dockerfile: services/ingest/backend/worker.Dockerfile
            platforms: linux/amd64
          - image: weave-ingest-frontend
            context: services/ingest/frontend
            dockerfile: services/ingest/frontend/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: weave-knowledge
            context: services/knowledge/backend
            dockerfile: services/knowledge/backend/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: weave-retrieval
            context: services/retrieval/backend
            dockerfile: services/retrieval/backend/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: weave-runtime
            context: services/runtime
            dockerfile: services/runtime/backend/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: weave-api
            context: services/api/backend
            dockerfile: services/api/backend/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: weave-tools-backend
            context: services/tools
            dockerfile: services/tools/Dockerfile
            platforms: linux/amd64,linux/arm64
          # The chat UI. Image and compose service still carry the tools name;
          # the source moved to services/chat (see that service's README).
          - image: weave-tools-frontend
            context: services/chat
            dockerfile: services/chat/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: weave-embeddings
            context: services/embeddings
            dockerfile: services/embeddings/Dockerfile
            platforms: linux/amd64,linux/arm64
          # amd64 only, same reasoning as the OCR worker: torch under QEMU is
          # the slowest build in this repository by a wide margin.
          - image: weave-reranker
            context: services/reranker
            dockerfile: services/reranker/Dockerfile
            platforms: linux/amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.version.outputs.value }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  chart:
    name: Helm chart
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        shell: bash
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz -o helm.tgz
          echo "9318379b847e333460d33d291d4c088156299a26cd93d570a7f5d0c36e50b5bb  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Lint chart
        run: helm lint "${{ env.CHART_PATH }}"

      - name: Log in to GHCR for Helm OCI
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        shell: bash
        run: |
          # Chart and app version follow the repository tag, so `helm install
          # --version X` and the image tags in values.yaml cannot drift apart.
          OUT=$(helm package "${{ env.CHART_PATH }}" \
            --version "${{ needs.version.outputs.value }}" \
            --app-version "${{ needs.version.outputs.value }}")
          echo "$OUT"
          FILE=$(printf '%s' "$OUT" | sed -n 's/^Successfully packaged chart and saved it to: //p' | xargs -n1 basename)
          helm push "$FILE" "oci://${{ env.OCI_REPO }}"

  release:
    name: GitHub release
    needs: [version, images, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.value }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, nothing to do."
            exit 0
          fi
          {
            echo "## Container images"
            echo
            echo '```'
            for i in weave-ingest-backend weave-ingest-worker weave-ingest-frontend \
                     weave-knowledge weave-retrieval weave-runtime weave-api \
                     weave-tools-backend weave-tools-frontend \
                     weave-embeddings weave-reranker; do
              echo "ghcr.io/${{ env.IMAGE_OWNER }}/${i}:${VERSION}"
            done
            echo '```'
            echo
            echo "\`weave-ingest-worker\` and \`weave-reranker\` are amd64 only;"
            echo "every other image is amd64 and arm64."
            echo
            echo "## Helm chart"
            echo
            echo '```bash'
            echo "helm install weave-ingest oci://${{ env.OCI_REPO }}/weave-ingest --version ${VERSION}"
            echo '```'
            echo
            echo "The chart covers Weave-Ingest. The remaining services deploy"
            echo "through the Compose stack in \`deploy/\`."
            echo
            echo "## Running it"
            echo
            echo "See the [quick start](https://github.com/${GH_REPO}#quick-start)"
            echo "and the [wiki](https://github.com/${GH_REPO}/wiki)."
          } > notes.md
          ARGS=(--title "$TAG" --notes-file notes.md)
          [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)
          gh release create "$TAG" "${ARGS[@]}"
