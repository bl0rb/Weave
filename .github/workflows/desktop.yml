name: Desktop app

# Tests and builds the tray app in clients/desktop: Weave-<version>.dmg
# (macOS, universal) and Weave-<version>.msi (Windows). Pull requests build
# exactly what a release would, so a broken installer shows up before the tag.
#
# Pushing a tag `desktop-vX.Y.Z` additionally publishes both installers as a
# GitHub release (anything with a hyphen, e.g. desktop-v0.2.0-rc.1, as a
# prerelease). The `desktop-` prefix keeps these tags out of release.yml,
# which publishes the server stack on `v*`.
#
# Signing is optional and switches on with its secrets (README of
# clients/desktop lists them): without them the macOS build is ad-hoc signed
# and the Windows build is unsigned -- fine for testing, not for rollout.

on:
  push:
    branches: [main]
    paths: ['clients/desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  pull_request:
    paths: ['clients/desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: dmg
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: windows-latest
            bundle: msi
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Install Rust targets
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Test
        working-directory: clients/desktop/src-tauri
        run: cargo test --locked

      # Tag desktop-v1.2.3 -> 1.2.3; otherwise the version in tauri.conf.json.
      # MSI versions must be numeric, so a prerelease suffix is dropped there.
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            VERSION="${GITHUB_REF_NAME#desktop-v}"
          else
            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p src-tauri/target
          printf '{"version":"%s"}' "${VERSION%%-*}" > src-tauri/target/version.conf.json

      - name: Build installer
        env:
          # macOS signing and notarisation (Tauri reads these itself).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Empty secrets must be unset, or Tauri tries to use them.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          npm ci
          npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} \
            --config src-tauri/target/version.conf.json
          mkdir -p dist
          cp src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle }} \
            "dist/Weave-${{ steps.version.outputs.value }}.${{ matrix.bundle }}"

      - name: Sign MSI
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "No WINDOWS_CERTIFICATE secret; MSI stays unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-Item dist\*.msi).FullName
          $code = $LASTEXITCODE
          Remove-Item $pfx
          exit $code

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Weave-${{ runner.os }}
          path: clients/desktop/dist/Weave-*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRE=()
          [[ "$GITHUB_REF_NAME" == *-*-* ]] && PRE=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/Weave-* \
            --title "Weave Desktop ${GITHUB_REF_NAME#desktop-v}" --generate-notes "${PRE[@]}"
