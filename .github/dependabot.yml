# Dependabot reads this file only from the repository root. The configuration
# that used to live in services/ingest/.github/ was never executed after the
# six repositories became this monorepo, and its "/backend" and "/frontend"
# directories no longer exist. Every manifest below was taken from
# `git ls-files`; a new service needs its own entry here, because Dependabot
# does not discover directories on its own.
version: 2
updates:
  # --- Python: each service pins its own requirements.txt against its own
  # virtual environment, but one entry with `directories` lets the group below
  # bundle them: a single weekly PR for every minor/patch bump across all
  # services instead of one PR per package and service. Majors still arrive
  # one by one. /services/ingest/backend covers requirements.txt and
  # requirements-worker.txt: Dependabot picks up every manifest in the
  # directory, and both of these are hash-locked.
  - package-ecosystem: "pip"
    directories:
      - "/services/api/backend"
      - "/services/embeddings"
      - "/services/ingest/backend"
      - "/services/knowledge/backend"
      - "/services/reranker"
      - "/services/retrieval/backend"
      - "/services/runtime/backend"
      - "/services/tools"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- Node: the chat interface and the Ingest portal frontend. One entry, so
  # the groups span both: React and Next move in lockstep in both apps.
  - package-ecosystem: "npm"
    directories:
      - "/services/chat"
      - "/services/ingest/frontend"
    schedule:
      interval: "weekly"
    groups:
      # React und ReactDOM muessen exakt dieselbe Version tragen -- React
      # bricht sonst beim Start ab ("Incompatible React versions"). Einzeln
      # gebumpt scheitert jede der beiden PRs an genau dieser Pruefung, und
      # einzeln gemerged waere main kaputt. Die Typen wandern mit, damit sie
      # nicht hinterherhinken.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # eslint-config-next liest die Next-Version, gegen die es gebaut wurde.
      # Auseinanderlaufen lassen heisst: Lint-Regeln fuer eine Version, die
      # nicht installiert ist.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      # Everything else that is a minor or patch bump, in one weekly PR for
      # both frontends. A dependency lands in the first group it matches, so
      # react and next above keep their own PRs.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- Base images, bundled into one weekly PR across every Dockerfile
  # directory.
  - package-ecosystem: "docker"
    directories:
      - "/services/api/backend"
      - "/services/chat"
      - "/services/embeddings"
      - "/services/ingest/frontend"
      - "/services/knowledge/backend"
      - "/services/reranker"
      - "/services/retrieval/backend"
      - "/services/runtime/backend"
      - "/services/tools"
    schedule:
      interval: "weekly"
    groups:
      base-images:
        patterns:
          - "*"
    ignore:
      # Python 3.15 (2026-11): onnxruntime (embeddings),
      # zstandard (runtime) and PyYAML (every service) ship no cp315 wheels
      # yet, and the slim images cannot build them; the runtime image fails
      # to build on 3.15 (bl0rb/Weave#388). Lift this once those three
      # publish cp315 wheels.
      - dependency-name: "python"
        versions: [">=3.15"]

  # Ingest's backend and worker images stay on Python 3.13: PaddlePaddle
  # (3.2.1 and the latest 3.3.1) publishes no cp314 wheels, and the worker
  # installs it on top of the same base image. Its own entry, because an
  # ignore rule applies to every directory of an entry. Lift this once
  # PaddlePaddle ships cp314 wheels (PyPI and the cu126 index).
  - package-ecosystem: "docker"
    directory: "/services/ingest/backend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]

  # --- The workflow actions themselves. Only .github/workflows/ at the root
  # is executed, so only that directory is watched.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
