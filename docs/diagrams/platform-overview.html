  <div class="frame">
    <p class="eyebrow">Architecture · Platform overview</p>
    <h1>Nine services, one flat network</h1>
    <p class="sub">Offline, Weave-Ingest and Weave-Knowledge turn a release into a searchable chunk store. Online, every chat and every scoped search ends up at Weave-Retrieval, the one service that reads that store.</p>

    <svg viewBox="0 0 920 604" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="platform-overview-title platform-overview-desc">
<title id="platform-overview-title">Nine services, one flat network</title>
<desc id="platform-overview-desc">Weave-Ingest releases documents to Weave-Knowledge, which embeds them into a Postgres chunk store; Chat UI and Weave-Tools both reach that store only through Weave-API/Weave-Runtime and Weave-Retrieval, which alone owns read access, while Weave-Embeddings and Weave-Reranker serve both the offline indexing path and the online search path as stateless model services.</desc>
