<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From upload to a cited answer</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-accent:  #4f46e5;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1300px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--color-muted);
      max-width: 78ch;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1300px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Document journey</p>
    <h1>From upload to a cited answer</h1>
    <p class="sub">Nothing is searchable until a document owner explicitly releases it — an unchangeable snapshot, one per job. A later withdrawal removes it from the index the same way: explicitly, and only from that point on.</p>

    <svg viewBox="0 0 1400 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="document-journey-title document-journey-desc">
<title id="document-journey-title">From upload to a cited answer</title>
<desc id="document-journey-desc">A source arrives by upload, email or Confluence sync, passes OCR and an automatic quality gate, and waits until its owner explicitly reviews and releases it as an immutable snapshot; only then does Weave-Knowledge chunk and embed it into the chunk store that Weave-Retrieval's hybrid search reads to build a cited answer, and an explicit withdrawal removes it from that store again.</desc>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#f8fafc"/>

<!-- ============ ARROWS (before boxes) ============ -->

<!-- a1 Sources -> OCR -->
<path d="M 200,164 H 272" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- a2 OCR -> Review -->
<path d="M 432,164 H 504" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="443" y="146" width="50" height="12" rx="2" fill="#f8fafc"/>
<text x="468" y="155" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GRADED</text>

<!-- a3 Review -> Knowledge -->
<path d="M 664,164 H 736" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="672" y="146" width="56" height="12" rx="2" fill="#f8fafc"/>
<text x="700" y="155" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELEASED</text>

<!-- a4 Knowledge -> Hybrid Search -->
<path d="M 896,164 H 968" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="904" y="146" width="56" height="12" rx="2" fill="#f8fafc"/>
<text x="932" y="155" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INDEXED</text>

<!-- a5 Hybrid Search -> Answer -->
<path d="M 1128,164 H 1200" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="1139" y="146" width="50" height="12" rx="2" fill="#f8fafc"/>
<text x="1164" y="155" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RANKED</text>

<!-- a6 Review -> Withdrawal (dashed, owner-initiated) -->
<path d="M 584,208 V 232 Q 584,240 592,240 H 672 Q 680,240 680,248 V 320" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="607" y="222" width="50" height="12" rx="2" fill="#f8fafc"/>
<text x="632" y="231" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WITHDRAW</text>

<!-- a7 Withdrawal -> Knowledge (dashed, removes chunks) -->
<path d="M 720,320 V 296 Q 720,288 728,288 H 808 Q 816,288 816,280 V 208" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="728" y="270" width="80" height="12" rx="2" fill="#f8fafc"/>
<text x="768" y="279" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REMOVE CHUNKS</text>

<!-- ============ NODES ============ -->

<!-- N1 Sources -->
<rect x="40" y="120" width="160" height="88" rx="6" fill="#f8fafc"/>
<rect x="40" y="120" width="160" height="88" rx="6" fill="rgba(71,85,105,0.10)" stroke="#64748b" stroke-width="1"/>
<rect x="48" y="128" width="52" height="12" rx="2" fill="transparent" stroke="rgba(100,116,139,0.40)" stroke-width="0.8"/>
<text x="74" y="137" fill="#64748b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
<text x="120" y="164" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Sources</text>
<text x="120" y="180" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">upload · .eml · Confluence</text>
<text x="120" y="192" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">portal or admin sync</text>

<!-- N2 OCR + Quality Gate -->
<rect x="272" y="120" width="160" height="88" rx="6" fill="#f8fafc"/>
<rect x="272" y="120" width="160" height="88" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
<rect x="280" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
<text x="294" y="137" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OCR</text>
<text x="352" y="164" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Quality Gate</text>
<text x="352" y="180" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PaddleOCR · StructureV3</text>
<text x="352" y="192" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">A ≥90% · B ≥75% · C below</text>

<!-- N3 Review & Release (FOCAL) -->
<rect x="504" y="120" width="160" height="88" rx="6" fill="#f8fafc"/>
<rect x="504" y="120" width="160" height="88" rx="6" fill="rgba(79,70,229,0.08)" stroke="#4f46e5" stroke-width="1"/>
<rect x="512" y="128" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,70,229,0.40)" stroke-width="0.8"/>
<text x="536" y="137" fill="#4f46e5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PORTAL</text>
<text x="584" y="164" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Review &amp; Release</text>
<text x="584" y="180" fill="#4f46e5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">owner or admin confirms</text>
<text x="584" y="192" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">immutable snapshot</text>

<!-- N4 Weave-Knowledge -->
<rect x="736" y="120" width="160" height="88" rx="6" fill="#f8fafc"/>
<rect x="736" y="120" width="160" height="88" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
<rect x="744" y="128" width="76" height="12" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
<text x="782" y="137" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KNOWLEDGE</text>
<text x="816" y="164" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Weave-Knowledge</text>
<text x="816" y="180" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chunk + embed</text>
<text x="816" y="192" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ weave_knowledge</text>

<!-- N5 Hybrid Search -->
<rect x="968" y="120" width="160" height="88" rx="6" fill="#f8fafc"/>
<rect x="968" y="120" width="160" height="88" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
<rect x="976" y="128" width="52" height="12" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
<text x="1002" y="137" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEARCH</text>
<text x="1048" y="164" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Hybrid Search</text>
<text x="1048" y="180" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vector + full-text · RRF</text>
<text x="1048" y="192" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cross-encoder rerank</text>

<!-- N6 Answer -->
<rect x="1200" y="120" width="160" height="88" rx="6" fill="#f8fafc"/>
<rect x="1200" y="120" width="160" height="88" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
<rect x="1208" y="128" width="44" height="12" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
<text x="1230" y="137" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHAT</text>
<text x="1280" y="164" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Answer</text>
<text x="1280" y="180" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">with sources</text>
<text x="1280" y="192" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Chat UI · MCP</text>

<!-- N7 Withdrawal (dashed / secondary path) -->
<rect x="600" y="320" width="200" height="72" rx="6" fill="#f8fafc"/>
<rect x="600" y="320" width="200" height="72" rx="6" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="700" y="352" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Withdrawal</text>
<text x="700" y="368" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">document.withdrawn · tombstoned</text>
<text x="700" y="380" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">uploads and history stay</text>

<!-- ============ LEGEND ============ -->
<line x1="40" y1="440" x2="1360" y2="440" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
<text x="40" y="456" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

<rect x="120" y="448" width="14" height="10" rx="2" fill="rgba(79,70,229,0.08)" stroke="#4f46e5" stroke-width="1"/>
<text x="140" y="456" fill="#475569" font-size="9" font-family="'Inter', sans-serif">Human decision, gates the index</text>

<rect x="368" y="448" width="14" height="10" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
<text x="388" y="456" fill="#475569" font-size="9" font-family="'Inter', sans-serif">Automatic step</text>

<rect x="540" y="448" width="14" height="10" rx="2" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
<text x="560" y="456" fill="#475569" font-size="9" font-family="'Inter', sans-serif">Withdrawal — exceptional path</text>
</svg>
  </div>
</body>
</html>
