<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 856" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="user-flow-title user-flow-desc">
<title id="user-flow-title">Drei Wege zur Frage, ein Weg zur Antwort</title>
<desc id="user-flow-desc">Swimlane-Diagramm des Weave-User-Flows: VS Code als MCP-Client, die Weave-Desktop-App für macOS und Windows und der Browser-Chat melden sich per OAuth mit PKCE beim SSO der Organisation an; Weave-Tools und Weave-API lassen Weave-Ingest bei jedem Aufruf Token, Nutzer und Leserechte auflösen; die Runtime leitet Detailfragen in die hybride Chunk-Suche von Weave-Retrieval und Überblicksfragen in das Wissensgedächtnis, das Retrieval mit derselben Rechte-Abfrage liest; die Antwort kommt mit Quellen zurück, oder gar nicht.</desc>

<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f46e5"/>
  </marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#f8fafc"/>

