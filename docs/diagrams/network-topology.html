  <div class="frame">
    <p class="eyebrow">Architecture · Network topology</p>
    <h1>Where Weave's network boundary actually is</h1>
    <p class="sub">All fourteen containers share one flat bridge network — data stores included. What separates the services is the bearer token each one demands, not the network.</p>

    <svg viewBox="0 0 1000 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="network-topology-title network-topology-desc">
<title id="network-topology-title">Where Weave's network boundary actually is</title>
<desc id="network-topology-desc">Browsers and n8n clients reach four Weave services that are meant to be published, while five internal-only services are published on the host as well; only PostgreSQL and Redis have no host port, so the real separation between services is the bearer token each one demands, not the network.</desc>
